<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Before We Go">
<meta name="theme-color" content="#11365d">
<meta name="robots" content="noindex, nofollow">
<title>Before We Go</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3ead7;color:#2a1f10;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;}
  h1{font-family:Georgia,serif;color:#11365d;font-size:24px;margin-bottom:8px;}
  p{font-size:14px;color:#5a4a30;max-width:400px;line-height:1.5;}
  a.btn{display:inline-block;margin-top:20px;background:#11365d;color:#fff;text-decoration:none;padding:14px 28px;border-radius:6px;font-size:15px;font-weight:600;}
  iframe{width:100%;max-width:800px;height:80vh;border:1px solid #d8c69a;border-radius:6px;margin-top:20px;background:#fff;}
</style>
</head>
<body>
  <h1>Before We Go</h1>
  <p>A letter from Dad, for the four of us.</p>
  <a class="btn" href="letter.pdf">Open the Letter</a>
  <iframe src="letter.pdf"></iframe>

</html>
